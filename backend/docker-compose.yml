version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: leavemanagement_db
    environment:
      POSTGRES_DB: leavemanagement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-network

  backend:
    image: leavemanagement_api
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    container_name: leavemanagement_api
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=leavemanagement;Username=postgres;Password=admin123
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # Geçici şifre e-postası — değerler backend/.env dosyasından okunur.
      # MAIL_FROM ve MAIL_PASSWORD boşsa kullanıcı oluşturma 503 döner (tasarım gereği).
      # Port 587 olmalı: SmtpClient(EnableSsl) STARTTLS kullanır, 465 (implicit TLS) desteklenmez.
      - MailSettings__SmtpServer=${MAIL_SMTP_SERVER:-smtp.gmail.com}
      - MailSettings__Port=${MAIL_PORT:-587}
      - MailSettings__SenderName=${MAIL_SENDER_NAME:-PermitFlow}
      - MailSettings__From=${MAIL_FROM:-}
      - MailSettings__Password=${MAIL_PASSWORD:-}
    depends_on:
      - postgres
    networks:
      - backend-network

volumes:
  pgdata:

networks:
  backend-network:
    driver: bridge